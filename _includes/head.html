<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141017" media="(prefers-color-scheme: dark)">
<script>
  /* Apply a saved light/dark choice before first paint to avoid a flash. */
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <ul aria-label="Elsewhere">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="{{ site.links.linkedin }}" rel="noopener">LinkedIn</a></li>
      <li><a href="{{ site.links.github }}" rel="noopener">GitHub</a></li>
      <li><a href="{{ site.links.scholar }}" rel="noopener">Google Scholar</a></li>
      <li><a href="{{ site.links.orcid }}" rel="noopener">ORCID</a></li>
      <li><a href="{{ site.links.bluesky }}" rel="noopener">Bluesky</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
    <p class="site-footer__fine">© {{ site.time | date: '%Y' }} Brandon Fricker{% if site.data.orcid_publications.generated_at_utc %} · papers synced from ORCID <span class="mono">{{ site.data.orcid_publications.generated_at_utc | date: '%Y-%m-%d' }}</span>{% endif %}</p>
  </div>
</footer>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="2" fill="#1C1044"/><circle cx="9" cy="10" r="2.4" fill="#FECF92"/><circle cx="12" cy="7.5" r="1.4" fill="#FECF92"/><circle cx="7" cy="13.5" r="1.2" fill="#FECF92"/><circle cx="19" cy="9" r="1.9" fill="#B73779"/><circle cx="21" cy="12" r="1.1" fill="#B73779"/><circle cx="18" cy="19" r="2.6" fill="#FE9F6D"/><circle cx="21.5" cy="21" r="1.3" fill="#FE9F6D"/><circle cx="9.5" cy="20" r="1.8" fill="#DE4968"/><circle cx="6.8" cy="22" r="1" fill="#DE4968"/></svg>
      <span>Brandon Fricker</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.navigation -%}
        {%- assign current = false -%}
        {%- if page.url == item.url -%}{%- assign current = true -%}{%- endif -%}
        {%- if item.match and page.url contains item.match -%}{%- assign current = true -%}{%- endif -%}
        <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
    <div class="header-actions">
      <button class="theme-toggle js-only" type="button" data-mode="system" aria-label="Color theme: match system. Switch to light.">
        <span data-show="system">{% include icon.html name="contrast" %}</span>
        <span data-show="light">{% include icon.html name="sun" %}</span>
        <span data-show="dark">{% include icon.html name="moon" %}</span>
      </button>
      <a class="btn" href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </div>
  </div>
</header>

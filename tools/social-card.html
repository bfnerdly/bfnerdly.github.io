<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"IBM Plex Sans",sans-serif;color:#F3EAF0;position:relative;
 background:radial-gradient(640px 480px at 88% 40%,rgba(162,98,143,.5),transparent 70%),radial-gradient(500px 360px at 0% 110%,rgba(217,164,65,.16),transparent 70%),linear-gradient(135deg,#241528,#35203F)}
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 58px,rgba(255,255,255,.028) 58px 60px)}
.wrap{position:relative;display:grid;grid-template-columns:1fr 330px;gap:56px;align-items:center;height:100%;padding:0 80px}
.mark{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#5B2F53;font:800 21px "Bricolage Grotesque";position:relative;margin-bottom:28px;border:1px solid rgba(255,255,255,.14)}
.mark::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#D9A441}
.kicker{font:500 17px "IBM Plex Mono";letter-spacing:.1em;text-transform:uppercase;color:#E2B35A;margin-bottom:16px}
h1{font:800 66px/1 "Bricolage Grotesque";letter-spacing:-.035em}
h1 span{color:#CF93B5}
.role{font:500 27px/1.25 "Bricolage Grotesque";color:#E8DDE5;margin-top:18px}
.tags{display:flex;gap:10px;margin-top:30px;flex-wrap:nowrap}
.tags b{font:500 15px "IBM Plex Mono";padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.08);color:#F3EAF0}
.url{position:absolute;left:80px;bottom:44px;font:500 18px "IBM Plex Mono";color:#B3A2B1}
.photo{position:relative}
.photo::before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:30px;background:repeating-linear-gradient(135deg,rgba(207,147,181,.28) 0 10px,transparent 10px 20px)}
.photo img{position:relative;width:330px;height:330px;object-fit:cover;border-radius:30px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
</style></head><body>
<div class="wrap">
 <div>
  <div class="mark">BF</div>
  <p class="kicker">Harvard University · Postdoctoral Fellow</p>
  <h1>Brandon Fricker<span>, PhD</span></h1>
  <p class="role">Behavioral neuroscientist &amp; decision scientist</p>
  <div class="tags"><b>Experimentation</b><b>Causal inference</b><b>Behavioral data science</b></div>
 </div>
 <div class="photo"><img src="../assets/images/headshot-square.jpg" alt=""></div>
</div>
<p class="url">bfnerdly.github.io</p>
</body></html>

<!doctype html>
<!-- Source for assets/images/social-card.jpg (1200x630). Open in Chrome at 1200x630 and screenshot. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0D0716;color:#F6EFF4;font-family:Archivo,sans-serif}
.map{position:absolute;inset:0 0 0 360px;background:url(../assets/images/map-fallback.jpg) 62% 50%/cover no-repeat}
.map::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0D0716 0%,rgba(13,7,22,.55) 26%,rgba(13,7,22,0) 48%)}
.panel{position:absolute;left:64px;top:64px;bottom:64px;width:560px;display:flex;flex-direction:column;justify-content:center}
.who{display:flex;align-items:center;gap:16px;margin-bottom:30px}
.who img{width:72px;height:72px;object-fit:cover;border-radius:2px}
.who p{font-size:20px;line-height:1.35;color:#D8C9DD}
.who b{display:block;color:#F6EFF4;font-weight:650}
h1{font-weight:800;font-stretch:112%;font-size:76px;line-height:1;letter-spacing:-.03em}
.role{font-stretch:112%;font-weight:560;font-size:30px;color:#FECF92;margin-top:18px}
.keys{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:34px;font-family:"Martian Mono",monospace;font-stretch:75%;font-size:17px;color:#D8C9DD}
.keys span{display:inline-flex;align-items:center;gap:9px}
.keys span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.url{position:absolute;right:56px;bottom:44px;font-family:"Martian Mono",monospace;font-stretch:75%;font-size:18px;color:#A898B1}
</style></head><body>
<div class="map"></div>
<div class="panel">
  <div class="who"><img src="../assets/images/headshot-square.jpg" alt=""><p><b>Postdoctoral Fellow, Harvard</b>Elya Lab · Cambridge, MA</p></div>
  <h1>Brandon<br>Fricker, PhD</h1>
  <p class="role">Data scientist &amp; behavioral neuroscientist</p>
  <div class="keys"><span style="--c:#FECF92">C1 Model the data</span><span style="--c:#FE9F6D">C2 Build the tool</span><span style="--c:#DE4968">C3 Design the study</span><span style="--c:#B73779">C4 Test the cause</span></div>
</div>
<p class="url">bfnerdly.github.io</p>
</body></html>

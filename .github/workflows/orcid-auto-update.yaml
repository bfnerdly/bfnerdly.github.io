name: Sync ORCID Publications

# Monthly refresh of _data/orcid_publications.json from ORCID + Crossref.
# Commits only when something actually changed; the push then triggers the Pages build.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orcid-sync
  cancel-in-progress: false

jobs:
  sync-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync ORCID publication data
        run: python sync_orcid_publications.py

      - name: Commit updated publication data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/orcid_publications.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Sync ORCID publications"
          git push

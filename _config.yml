title: "Brandon Fricker, PhD"
tagline: "Behavioral neuroscientist · Decision scientist"
description: >-
  Brandon Fricker, PhD: behavioral neuroscientist and decision scientist at Harvard.
  I design controlled experiments, measure behavior at scale, and turn
  high-dimensional data into clear decisions.
url: "https://bfnerdly.github.io"
baseurl: ""
lang: en_US
timezone: America/New_York

# Shown as a small status pill on the home page. Delete the line to hide it.
open_to: "Open to decision science, experimentation & behavioral data science roles"

author:
  name: "Brandon Fricker"
  email: "bfricker@g.harvard.edu"
  image: /assets/images/headshot-square.jpg

# Used by jekyll-seo-tag for social cards and search-engine structured data.

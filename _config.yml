  scholar: https://scholar.google.com/citations?user=MD8OzNcAAAAJ&hl=en
  # Drop a PDF at assets/files/ and set this to show a "Résumé" button.
  cv: ""

# EthoCrypt lives in its own private repo (bfnerdly/ethocrypt). Its GitHub Pages
# site publishes to https://bfnerdly.github.io/ethocrypt/, which is why the tab
# here lives at /projects/ethocrypt/ instead (the project site would shadow it).
#   pages_live:  set true once Pages is enabled on the repo (needs GitHub Pro,
#                free with the GitHub Student Developer Pack, while it stays private)
#   repo_public: set true if/when the repository itself is made public
ethocrypt:
  pages_live: false
  repo_public: false
  pages_url: https://bfnerdly.github.io/ethocrypt/
  field_guide_url: https://bfnerdly.github.io/ethocrypt/EthoCrypt_Field_Guide.html
  report_url: https://bfnerdly.github.io/ethocrypt/example_report_smoke_test.html
  repo_url: https://github.com/bfnerdly/ethocrypt

# No theme: layouts, includes and CSS all live in this repo.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /news/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/social-card.jpg   # social preview card (1200x630)
  - scope:
      path: ""
      type: posts
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - sync_orcid_publications.py
  - requirements.txt
  - __pycache__
  - vendor
  - .jekyll-cache
  - tools

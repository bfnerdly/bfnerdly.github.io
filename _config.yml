    - https://orcid.org/0000-0002-6037-814X
    - https://scholar.google.com/citations?user=MD8OzNcAAAAJ
    - https://github.com/bfnerdly

links:
  linkedin: https://www.linkedin.com/in/brandonfricker/
  bluesky: https://bsky.app/profile/brandonfricker.bsky.social
  github: https://github.com/bfnerdly
